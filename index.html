</style></head><body>

up to date|auf dem Laufenden; modern; zeitgemäß; aktuell|The information on his profile is always up to date.

/* ===== ENDE DER DATEN ===== */
const V=RAW.trim().split('\n').map(l=>{const[a,b,c]=l.split('|');return{en:a,de:b,ex:c||'',alts:b.split(';').map(s=>s.trim())}});
const $=document.getElementById('app'),g=id=>document.getElementById(id),e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),sh=a=>[...a].sort(()=>Math.random()-.5);
let acc;try{acc=JSON.parse(localStorage.getItem('vokAcc'))}catch(_){}acc=acc||{names:[],last:''};
try{if(!acc.names.length&&localStorage.getItem('vok1')){localStorage.setItem('vok1:Ich',localStorage.getItem('vok1'));acc.names=['Ich'];acc.last='Ich'}}catch(_){}
if(!acc.names.includes(acc.last))acc.last='';
const saveAcc=()=>{try{localStorage.setItem('vokAcc',JSON.stringify(acc))}catch(_){}};
const loadS=()=>{let x;try{x=JSON.parse(localStorage.getItem('vok1:'+acc.last))}catch(_){}return x||{p:{},fav:[],hist:[],days:{},theme:''}};
let S=loadS();
const sv=()=>{if(!acc.last)return;try{localStorage.setItem('vok1:'+acc.last,JSON.stringify(S))}catch(_){}};
const ds=()=>new Date().toLocaleDateString('sv'),D=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
const P=k=>S.p[k]||(S.p[k]={box:0,due:0,ok:0,bad:0});
const learned=v=>(S.p[v.en]||{}).box>=3,weak=v=>{const p=S.p[v.en];return !!p&&p.bad>0&&p.box<3},isDue=v=>{const p=S.p[v.en];return !p||p.due<=D()};
function rec(v,ok){const p=P(v.en);if(ok){p.ok++;p.box=Math.min(p.box+1,5)}else{p.bad++;p.box=0}p.due=D()+[0,1,2,4,8,16][p.box];const d=ds();S.days[d]=(S.days[d]||0)+1;sv()}
const norm=s=>s.toLowerCase().replace(/\(.*?\)/g,'').replace(/[*….!?,]/g,'').replace(/\b(etw|sth|sb|jmdn|jmdm|jmds)\b\.?/g,'').replace(/\s+/g,' ').trim();
const okEn=(a,v)=>{const x=norm(a),t=norm(v.en);return x==t||x==t.replace(/^to /,'')||'to '+x==t};
const okDe=(a,v)=>v.alts.some(s=>[norm(s),norm(s).split('/')[0]].includes(norm(a)));
function setTheme(){document.documentElement.dataset.theme=S.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}
function tg(){S.theme=document.documentElement.dataset.theme=='dark'?'light':'dark';sv();setTheme()}
function streak(){let n=0,d=new Date();if(!S.days[d.toLocaleDateString('sv')])d.setDate(d.getDate()-1);while(S.days[d.toLocaleDateString('sv')]){n++;d.setDate(d.getDate()-1)}return n}
const MODES=[['cards','🃏','Lernen','Schwierige Vokabeln kommen öfter'],['flip','🔄','Karteikarten','Zufällig durchblättern'],['ed','🇩🇪','Englisch → Deutsch','Übersetzung eintippen'],['de','🇬🇧','Deutsch → Englisch','Englisches Wort eintippen'],['mc','✅','Multiple Choice','4 Antworten'],['wr','✍️','Schreibtraining','Rechtschreibung üben'],['mix','🎯','Gemischter Test','15 Fragen, alle Modi'],['err','🔧','Fehlertraining','Deine Fehlerliste'],['fav','⭐','Favoriten üben','Deine markierten Vokabeln']];
let cur=null,F={q:'',f:'all',p:'all'};const SZ=Math.ceil(V.length/10),sel=()=>{const x=S.sel||[];return x.length?V.filter((v,i)=>x.includes(Math.floor(i/SZ))):V};
function say(t){try{const u=new SpeechSynthesisUtterance(t.replace(/^\*/,'').replace(/\(.*?\)/g,''));u.lang='en-GB';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(_){}}
function selp(p){S.sel=S.sel||[];const j=S.sel.indexOf(p);j<0?S.sel.push(p):S.sel.splice(j,1);sv();home()}
function hint(){const x=cur.it[cur.i],sol=(x.t=='ed'?x.v.alts[0]:x.v.en).replace(/^\*/,'');g('hn').textContent='Beginnt mit: '+sol.slice(0,Math.ceil(sol.length/3))+' …'}
function go(v){cur=null;({home,list,stats})[v]()}
function home(){const col=['#6366f1','#8b5cf6','#0ea5e9','#14b8a6','#22c55e','#f59e0b','#ef4444','#ec4899','#eab308'],x=S.sel||[];
const chips=Array.from({length:10},(_,p)=>{const a=V.filter((v,i)=>Math.floor(i/SZ)==p);if(!a.length)return'';return `<button class="k chip ${x.includes(p)?'on':''}" onclick="selp(${p})"><b style="font-size:20px">Teil ${p+1}</b><small>${a.length} Vokabeln · ${a.filter(learned).length} sicher</small><small>ab „${e(a[0].en)}“</small></button>`}).join('');
$.innerHTML=`<h2>Vokabeln auswählen</h2><div class=g>${chips}</div><div class=row><button class=btn onclick="S.sel=[];sv();home()">Alle Teile</button><small>${x.length?'Ausgewählt: Teil '+[...x].sort((a,b)=>a-b).map(p=>p+1).join(', '):'Alle Teile ausgewählt'} (${sel().length} Vokabeln)</small></div><div class=row><label>Fragen pro Runde <select class=btn onchange="S.n=+this.value;sv()">${[5,10,15,20,30].map(n=>`<option ${n==(S.n||10)?'selected':''}>${n}</option>`).join('')}</select></label><label>Karten starten mit <select class=btn onchange="S.dir=this.value;sv()"><option value=en ${S.dir!='de'?'selected':''}>Englisch</option><option value=de ${S.dir=='de'?'selected':''}>Deutsch</option></select></label></div><h2>Üben</h2><p><small>Was du schlecht kannst, kommt öfter dran; was du sicher kannst, seltener.</small></p><div class=g>${MODES.map((m,i)=>`<button class="k m" style="border-top:5px solid ${col[i%9]}" onclick="start('${m[0]}')"><b>${m[1]}</b>${m[2]}<br><small>${m[3]}</small></button>`).join('')}</div><p><button class=btn onclick="if(confirm('Gesamten Fortschritt löschen?')){S={p:{},fav:[],hist:[],days:{},theme:S.theme};sv();go('home')}"><small>Fortschritt zurücksetzen</small></button></p>`}
function msg(h,t){$.innerHTML=`<div class=k><h2>${h}</h2><p>${t}</p><button class="btn p" onclick="go('home')">Zurück</button></div>`}
const wt=v=>{const p=S.p[v.en];return p?[6,4,2.5,1,.5,.25][p.box]*(p.bad>p.ok?1.5:1):3};
function wpick(n,pool=sel()){const a=[...pool],r=[];while(r.length<n&&a.length){let u=Math.random()*a.reduce((x,v)=>x+wt(v),0),i=0;for(;i<a.length-1;i++){u-=wt(a[i]);if(u<=0)break}r.push(a.splice(i,1)[0])}return r}
function rq(v,t){const Q=cur;Q.rq=Q.rq||{};if(!Q.rq[v.en]){Q.rq[v.en]=1;Q.it.splice(Math.min(Q.i+4,Q.it.length),0,{v,t})}}
function start(m){let it;const N=S.n||10,T=['ed','de','wr','mc'],rt=()=>T[Math.floor(Math.random()*4)];
if(m=='cards')it=wpick(N).map(v=>({v,t:'card'}));
else if(m=='flip')it=sh(sel()).slice(0,N).map(v=>({v,t:'card'}));
else if(m=='mix')it=wpick(N).map(v=>({v,t:rt()}));
else if(m=='err'||m=='fav'){const p=m=='err'?V.filter(weak):V.filter(v=>S.fav.includes(v.en));if(!p.length)return msg(m=='err'?'Keine Fehler 👍':'Noch keine Favoriten ⭐',m=='err'?'Falsch beantwortete Vokabeln erscheinen hier und verschwinden nach 3 richtigen Antworten in Folge.':'Markiere Vokabeln in der Wortliste mit dem Stern.');it=wpick(Math.min(N,p.length),p).map(v=>({v,t:rt()}))}
else it=wpick(N).map(v=>({v,t:m}));
run(it,m)}
function run(it,m){cur={it,m,i:0,ok:0,bad:0,wrong:[]};q()}
function q(){const Q=cur,x=Q.it[Q.i];if(!x)return end();const v=x.v,t=x.t;Q.done=0;Q.fl=0;let b;
const hd=`<small>Frage ${Q.i+1} von ${Q.it.length}</small><div class=bar><i style="width:${Q.i/Q.it.length*100}%"></i></div><br>`;
if(t=='card')b=`<div class="k fc" id=fc onclick="flip()"><div id=fcn>${e(S.dir=='de'?v.de:v.en)}</div><small>Antippen zum Umdrehen</small></div><div id=fb></div>`;
else if(t=='mc'){Q.o=sh([v.de,...sh(V.filter(y=>y.de!=v.de)).slice(0,3).map(y=>y.de)]);b=`<h2>${e(v.en)} <button class=btn onclick="say(cur.it[cur.i].v.en)">🔊</button></h2><small>Was bedeutet das?</small>`+Q.o.map((o,i)=>`<button class="btn opt" onclick="pick(${i})">${e(o)}</button>`).join('')+`<div id=fb></div>`}
else{const w=v.en.replace(/^\*/,'');b=`<h2>${t=='ed'?e(v.en)+' <button class=btn onclick="say(cur.it[cur.i].v.en)">🔊</button>':e(v.alts.join(' / '))}</h2><small>${t=='ed'?'Gib die deutsche Übersetzung ein':t=='de'?'Gib das englische Wort ein':'Schreibe das englische Wort: '+w.length+' Zeichen, beginnt mit „'+e(w[0])+'“'}</small><button class=btn onclick="hint()">💡 Tipp</button> <small id=hn></small><input id=in autocomplete=off autocapitalize=none spellcheck=false><div id=fb></div><button class="btn p" id=go onclick="chk()">Prüfen</button>`}
$.innerHTML=hd+b;const i=g('in');if(i)i.focus()}
function flip(){const v=cur.it[cur.i].v;cur.fl=!cur.fl;g('fcn').innerHTML=cur.fl?`<b>${e(S.dir=='de'?v.en:v.de)}</b><br><small>${e(v.ex)}</small>`:e(S.dir=='de'?v.de:v.en);if(cur.fl)g('fb').innerHTML=`<button class="btn" onclick="say(cur.it[cur.i].v.en)">🔊</button> <button class="btn no" onclick="ans(0)">Noch üben</button> <button class="btn ok" onclick="ans(1)">Gewusst</button>`}
function ans(ok){const Q=cur,v=Q.it[Q.i].v;rec(v,ok);ok?Q.ok++:(Q.bad++,Q.wrong.push(v),rq(v,'card'));Q.i++;q()}
function chk(){const Q=cur,x=Q.it[Q.i],v=x.v,a=g('in').value;if(!a.trim())return;Q.done=1;fin(x.t=='ed'?okDe(a,v):okEn(a,v),v,x.t=='ed'?v.de:v.en,a,x.t)}
function pick(i){const Q=cur;if(Q.done)return;Q.done=1;const v=Q.it[Q.i].v;document.querySelectorAll('.opt').forEach((b,j)=>{if(Q.o[j]==v.de)b.style.borderColor='var(--ok)';else if(j==i)b.style.borderColor='var(--no)'});fin(Q.o[i]==v.de,v,v.de,'','mc')}
function fin(ok,v,sol,a,t){const Q=cur,o=g('go');if(o)o.remove();rec(v,ok);ok?Q.ok++:(Q.bad++,Q.wrong.push(v),rq(v,Q.it[Q.i].t));let w='';
if(!ok&&t=='wr'){const s=sol.replace(/^\*/,'').toLowerCase();w='<br>Deine Schreibweise: '+[...a].map((c,i)=>c.toLowerCase()==s[i]?e(c):`<span class=x>${e(c)}</span>`).join('')}
g('fb').innerHTML=`<div class="f ${ok?'y':'n'}">${ok?'Richtig! 🎉':'Nicht schlimm, daraus lernst du! Richtig ist:<br><b>'+e(sol)+'</b>'+w}${v.ex?`<br><small>${e(v.ex)}</small>`:''}</div><button class=btn onclick="say(cur.it[cur.i].v.en)">🔊</button> <button class="btn p" id=go onclick="nxt()">Weiter</button>`}
function nxt(){cur.i++;q()}
document.addEventListener('keydown',ev=>{if(ev.key=='Enter'){const b=g('go');if(b)b.click()}});
function end(){const Q=cur;Q.wrong=[...new Set(Q.wrong)];const n=Q.ok+Q.bad,pc=n?Math.round(Q.ok/n*100):0;if(Q.m!='flip'&&Q.m!='cards'){S.hist.unshift({d:ds(),m:Q.m,n,ok:Q.ok});S.hist=S.hist.slice(0,30)}sv();
$.innerHTML=`<div class=k><h2>${pc>=80?'Super gemacht! 🌟':pc>=50?'Gut dabei! 💪':'Weiter so, Übung macht den Meister! 🌱'}</h2><p><b>${Q.ok}</b> richtig, <b>${Q.bad}</b> falsch (${pc} %)</p>${Q.wrong.length?`<p><small>Zum Wiederholen: ${Q.wrong.map(v=>e(v.en)).join(', ')}</small></p><button class="btn p" onclick="again()">Falsche erneut üben</button> `:''}<button class="btn" onclick="start('${Q.m}')">Nochmal</button> <button class="btn" onclick="go('home')">Start</button></div>`}
function again(){run(sh(cur.wrong).map(v=>({v,t:'ed'})),'err')}
function list(){$.innerHTML=`<h2>Wortliste (${V.length})</h2><input id=s placeholder="Suchen …" value="${e(F.q)}" oninput="F.q=this.value;rows()"><select class=btn onchange="F.f=this.value;rows()">${[['all','Alle'],['fav','Favoriten ★'],['lrn','Gelernt'],['new','Noch neu'],['wk','Fehlerliste']].map(o=>`<option value=${o[0]} ${F.f==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select><select class=btn onchange="F.p=this.value;rows()"><option value=all>Alle Teile</option>${Array.from({length:10},(_,i)=>V.length>i*SZ?`<option value=${i} ${F.p==i?'selected':''}>Teil ${i+1}</option>`:'').join('')}</select><div id=rw></div>`;rows()}
function rows(){const q=F.q.toLowerCase(),k=s=>norm(s).replace(/^to /,'');const a=V.filter(v=>(!q||(v.en+v.de+v.ex).toLowerCase().includes(q))&&(F.p=='all'||Math.floor(V.indexOf(v)/SZ)==F.p)&&({all:1,fav:S.fav.includes(v.en),lrn:learned(v),new:!S.p[v.en],wk:weak(v)}[F.f])).sort((x,y)=>k(x.en).localeCompare(k(y.en)));
g('rw').innerHTML=`<p><small>${a.length} Treffer, alphabetisch</small></p>`+a.map(v=>`<div class=r><button class=btn onclick="fav(${V.indexOf(v)})">${S.fav.includes(v.en)?'★':'☆'}</button><button class=btn onclick="say(V[${V.indexOf(v)}].en)">🔊</button><div><b>${e(v.en)}</b> – ${e(v.de)}${v.ex?`<br><small>${e(v.ex)}</small>`:''}</div></div>`).join('')}
function fav(i){const k=V[i].en,j=S.fav.indexOf(k);j<0?S.fav.push(k):S.fav.splice(j,1);sv();rows()}
function who(){g('who').textContent='👤 '+(acc.last||'Anmelden')}
function login(){cur=null;$.innerHTML=`<h2>Wer lernt gerade?</h2><p><small>Jedes Profil hat seinen eigenen Fortschritt. Er wird nur in diesem Browser auf diesem Gerät gespeichert.</small></p>${acc.names.map((n,i)=>`<div class=row><button class="k m" style="flex:1" onclick="enter(${i})"><b style="display:inline">👤</b> ${e(n)}${n==acc.last?' (aktiv)':''}</button><button class=btn onclick="delP(${i})" aria-label="Löschen">✕</button></div>`).join('')}<div class=k><h3>Neues Profil</h3><input id=nn placeholder="Dein Name" maxlength=20><button class="btn p" onclick="newP()">Anlegen</button></div>`}
function enter(i){acc.last=acc.names[i];saveAcc();S=loadS();setTheme();who();home()}
function newP(){const n=g('nn').value.trim().slice(0,20);if(!n)return;if(acc.names.includes(n))return alert('Diesen Namen gibt es schon.');acc.names.push(n);enter(acc.names.length-1)}
function delP(i){const n=acc.names[i];if(confirm('Profil „'+n+'“ und den Fortschritt löschen?')){try{localStorage.removeItem('vok1:'+n)}catch(_){}acc.names.splice(i,1);if(acc.last==n){acc.last='';S=loadS();who()}saveAcc();login()}}
function exp(){const b=new Blob([JSON.stringify({name:acc.last,data:S})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='vokabeln-'+acc.last+'.json';a.click()}
function imp(inp){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.data||!j.data.p)throw 0;if(confirm('Aktuellen Fortschritt mit der Datei überschreiben?')){S=j.data;sv();stats()}}catch(_){alert('Datei nicht lesbar.')}};if(inp.files[0])r.readAsText(inp.files[0])}
function stats(){if(!acc.last)return login();const pr=Object.values(S.p),ok=pr.reduce((a,p)=>a+p.ok,0),bad=pr.reduce((a,p)=>a+p.bad,0),n=V.length,L=V.filter(learned).length,seen=V.filter(v=>S.p[v.en]).length,acu=ok+bad?Math.round(ok/(ok+bad)*100):0;
const days=[6,5,4,3,2,1,0].map(i=>{const d=new Date();d.setDate(d.getDate()-i);return{l:d.toLocaleDateString('de',{weekday:'short'}),v:S.days[d.toLocaleDateString('sv')]||0}}),mx=Math.max(1,...days.map(d=>d.v));
const parts=Array.from({length:10},(_,p)=>{const a=V.filter((v,i)=>Math.floor(i/SZ)==p);if(!a.length)return'';const l=a.filter(learned).length;return `<div>Teil ${p+1}: ${l}/${a.length} sicher<div class=bar><i style="width:${l/a.length*100}%"></i></div></div>`}).join('<br>');
const hard=V.filter(v=>S.p[v.en]&&S.p[v.en].bad>0).sort((a,b)=>S.p[b.en].bad-S.p[a.en].bad).slice(0,8),wk=V.filter(weak),td=S.days[ds()]||0;
$.innerHTML=`<h2>Statistik: ${e(acc.last)}</h2><div class=g><div class=k><b>${Math.round(L/n*100)} %</b><small>sicher gelernt (${L}/${n})</small></div><div class=k><b>${seen}</b><small>Vokabeln schon geübt</small></div><div class=k><b>${acu} %</b><small>Trefferquote (${ok} richtig, ${bad} falsch)</small></div><div class=k><b>${streak()}</b><small>Tage in Folge</small></div><div class=k><b>${td}</b><small>Antworten heute</small></div></div><br>
<div class=k><h3>Letzte 7 Tage (Antworten)</h3><div class=bars>${days.map(d=>`<div><small>${d.v}</small><i style="height:${d.v/mx*80}px"></i><small>${d.l}</small></div>`).join('')}</div></div><br>
<div class=k><h3>Fortschritt pro Teil</h3>${parts}</div><br>
<div class=k><h3>Schwierigste Vokabeln</h3>${hard.map(v=>`<div>${e(v.en)} – ${e(v.de)} <small>(${S.p[v.en].bad}× falsch)</small></div>`).join('')||'<small>Noch keine Fehler 🎉</small>'}</div><br>
<div class=k><h3>Fehlerliste (${wk.length})</h3>${wk.map(v=>`<div>${e(v.en)} – ${e(v.de)}</div>`).join('')||'<small>Leer 🎉</small>'}${wk.length?'<p><button class="btn p" onclick="start(\'err\')">Fehler üben</button></p>':''}</div><br>
<div class=k><h3>Letzte Tests</h3>${S.hist.slice(0,10).map(h=>`<div>${h.d}: ${MODES.find(m=>m[0]==h.m)[2]}: ${h.ok}/${h.n} richtig (${h.n?Math.round(h.ok/h.n*100):0} %)</div>`).join('')||'<small>Noch keine Tests.</small>'}</div><br>
<div class=k><h3>Profil &amp; Daten</h3><div class=row><button class=btn onclick="login()">Profil wechseln</button><button class=btn onclick="exp()">Fortschritt exportieren</button><label class=btn>Importieren<input type=file accept=".json" hidden onchange="imp(this)"></label></div><small>Mit Export/Import kannst du deinen Fortschritt auf ein anderes Gerät mitnehmen.</small></div>`}
setTheme();who();acc.last?home():login();
</script></body></html>
